<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | PROPERTY DEALERS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>


<script>

(function(){

    const theme =
        localStorage.getItem(
            "pd_theme"
        );

        theme === "dark"
    ){

        document.documentElement
            .classList
            .add("dark");

    }

})();

</script>


<style>

/* =========================================================
   THEME
========================================================= */

:root{

    --bg:#f5f3fb;

    --surface:#ffffff;

    --surface2:#faf9fd;

    --text:#17131f;

    --muted:#756e82;

    --border:#e7e1ef;

    --purple:#7c3aed;

    --purple-light:
        rgba(124,58,237,.10);

    --green:#16a34a;

    --red:#ef4444;

    --orange:#f59e0b;

    --shadow:
        0 18px 50px
        rgba(67,45,105,.09);

}


html.dark{

    --bg:#09080e;

    --surface:#12101a;

    --surface2:#17141f;

    --text:#f8f5ff;

    --muted:#aaa2b8;

    --border:#2b2635;

    --purple:#9b63ff;

    --purple-light:
        rgba(155,99,255,.13);

    --green:#22c55e;

    --red:#ff5c68;

    --orange:#fbbf24;

    --shadow:
        0 25px 65px
        rgba(0,0,0,.50);

}


/* =========================================================
   RESET
========================================================= */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

}

body{

    font-family:
        Inter,
        Arial,
        sans-serif;

    background:
        var(--bg);

    color:
        var(--text);

    min-height:100vh;

}

a{

    color:inherit;

}


/* =========================================================
   NAVBAR
========================================================= */

.navbar{

    width:100%;

    height:74px;

    padding:
        0 5%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
        var(--surface);

    border-bottom:
        1px solid var(--border);

    position:sticky;

    top:0;

    z-index:1000;

}

.logo{

    text-decoration:none;

    color:
        var(--text);

    font-size:21px;

    font-weight:800;

    letter-spacing:-.5px;

}

.logo span{

    color:
        var(--purple);

}

.nav-links{

    display:flex;

    align-items:center;

    gap:7px;

}

.nav-links a{

    height:40px;

    min-width:82px;

    padding:
        0 14px;

    display:flex;

    align-items:center;

    justify-content:center;

    line-height:1;

    text-decoration:none;

    color:
        var(--muted);

    border-radius:10px;

    font-size:13px;

    font-weight:600;

}

.nav-links a:hover,
.nav-links a.active{

    background:
        var(--purple-light);

    color:
        var(--purple);

}

.nav-actions{

    display:flex;

    align-items:center;

    gap:10px;

}

.theme-btn{

    width:42px;

    height:42px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:0;

    border:
        1px solid var(--border);

    border-radius:11px;

    background:
        var(--surface2);

    color:
        var(--text);

    font-size:18px;

    cursor:pointer;

}

.admin-badge{

    height:36px;

    padding:
        0 11px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:9px;

    background:
        var(--purple-light);

    color:
        var(--purple);

    font-size:10px;

    font-weight:800;

    letter-spacing:.5px;

}


/* =========================================================
   PAGE
========================================================= */

.page{

    width:min(
        1400px,
        92%
    );

    margin:auto;

    padding:
        40px 0 80px;

}

.page-header{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:20px;

    margin-bottom:28px;

}

.eyebrow{

    color:
        var(--purple);

    font-size:10px;

    font-weight:800;

    letter-spacing:2px;

    margin-bottom:9px;

}

.page-header h1{

    font-size:
        clamp(
            31px,
            4vw,
            46px
        );

    line-height:1;

    letter-spacing:-1.7px;

    margin-bottom:10px;

}

.page-header p{

    color:
        var(--muted);

    font-size:13px;

}


/* =========================================================
   STATS
========================================================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(
            5,
            1fr
        );

    gap:14px;

    margin-bottom:24px;

}

.stat-card{

    background:
        var(--surface);

    border:
        1px solid var(--border);

    border-radius:17px;

    padding:18px;

    box-shadow:
        var(--shadow);

}

.stat-label{

    color:
        var(--muted);

    font-size:9px;

    font-weight:700;

    margin-bottom:8px;

    letter-spacing:.4px;

}

.stat-value{

    font-size:26px;

    font-weight:800;

    letter-spacing:-1px;

}

.stat-value.green{
    color:var(--green);
}

.stat-value.orange{
    color:var(--orange);
}

.stat-value.red{
    color:var(--red);
}


/* =========================================================
   MAIN GRID
========================================================= */

.main-grid{

    display:grid;

    grid-template-columns:
        1fr
        300px;

    gap:20px;

    align-items:start;

}


/* =========================================================
   PANEL
========================================================= */

.panel{

    background:
        var(--surface);

    border:
        1px solid var(--border);

    border-radius:20px;

    padding:20px;

    box-shadow:
        var(--shadow);

}

.panel-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    margin-bottom:16px;

}

.panel-title{

    font-size:17px;

    font-weight:800;

    letter-spacing:-.4px;

}

.panel-subtitle{

    color:
        var(--muted);

    font-size:10px;

    margin-top:4px;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:15px;

}

.search{

    flex:1;

    height:42px;

    padding:
        0 12px;

    border:
        1px solid var(--border);

    border-radius:10px;

    background:
        var(--surface2);

    color:
        var(--text);

    font-family:inherit;

    font-size:11px;

    outline:none;

}

.search:focus{

    border-color:
        var(--purple);

}

.filter{

    width:160px;

    height:42px;

    border:
        1px solid var(--border);

    border-radius:10px;

    background:
        var(--surface2);

    color:
        var(--text);

    padding:
        0 10px;

    font-family:inherit;

    font-size:11px;

    outline:none;

}


/* =========================================================
   LIST
========================================================= */

.list{

    display:grid;

    gap:11px;

}

.listing{

    display:grid;

    grid-template-columns:
        82px
        1fr
        auto;

    gap:13px;

    align-items:center;

    padding:11px;

    border:
        1px solid var(--border);

    border-radius:14px;

    background:
        var(--surface2);

}

.listing-photo{

    width:82px;

    height:70px;

    border-radius:10px;

    background:
        var(--surface);

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    font-size:34px;

}

.listing-photo img{

    width:100%;

    height:100%;

    object-fit:cover;

}

.listing-main{

    min-width:0;

}

.listing-top{

    display:flex;

    align-items:center;

    gap:8px;

    flex-wrap:wrap;

    margin-bottom:6px;

}

.listing-title{

    font-size:13px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.status{

    padding:
        5px 8px;

    border-radius:50px;

    font-size:8px;

    font-weight:800;

    letter-spacing:.6px;

    white-space:nowrap;

}

.status.pending{

    color:
        var(--orange);

    background:
        rgba(245,158,11,.12);

}

.status.active{

    color:
        var(--green);

    background:
        rgba(22,163,74,.12);

}

.status.sold{

    color:
        var(--red);

    background:
        rgba(239,68,68,.12);

}

.listing-price{

    color:
        var(--purple);

    font-size:13px;

    font-weight:800;

    margin-bottom:6px;

}

.listing-meta{

    display:flex;

    flex-wrap:wrap;

    gap:6px 12px;

    color:
        var(--muted);

    font-size:9px;

}

.listing-actions{

    display:flex;

    align-items:center;

    gap:6px;

    flex-wrap:wrap;

    justify-content:flex-end;

}


/* =========================================================
   BUTTONS
========================================================= */

.btn{

    height:35px;

    padding:
        0 10px;

    border-radius:8px;

    border:
        1px solid var(--border);

    background:
        var(--surface);

    color:
        var(--text);

    font-family:inherit;

    font-size:9px;

    font-weight:800;

    cursor:pointer;

    white-space:nowrap;

    text-decoration:none;

    display:flex;

    align-items:center;

    justify-content:center;

}

.btn:hover{

    border-color:
        var(--purple);

}

.btn.approve{

    color:
        var(--green);

}

.btn.reject{

    color:
        var(--orange);

}

.btn.delete{

    color:
        var(--red);

}

.btn.primary{

    background:
        var(--purple);

    border-color:
        var(--purple);

    color:#fff;

}

.btn:disabled{

    opacity:.5;

    cursor:wait;

}


/* =========================================================
   ACTIVITY
========================================================= */

.activity-list{

    display:grid;

    gap:10px;

}

.activity{

    display:flex;

    align-items:flex-start;

    gap:9px;

    padding:11px;

    border:
        1px solid var(--border);

    border-radius:11px;

    background:
        var(--surface2);

}

.activity-icon{

    width:29px;

    height:29px;

    flex:none;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:8px;

    background:
        var(--purple-light);

    color:
        var(--purple);

    font-size:13px;

}

.activity-title{

    font-size:10px;

    font-weight:800;

    margin-bottom:3px;

}

.activity-text{

    color:
        var(--muted);

    font-size:9px;

    line-height:1.5;

}


/* =========================================================
   TOOLS
========================================================= */

.tool-list{

    display:grid;

    gap:8px;

}

.tool{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:12px;

    border:
        1px solid var(--border);

    border-radius:11px;

    background:
        var(--surface2);

}

.tool-info strong{

    display:block;

    font-size:10px;

    margin-bottom:3px;

}

.tool-info span{

    color:
        var(--muted);

    font-size:8px;

}

.tool-arrow{

    color:
        var(--purple);

    font-weight:800;

}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    padding:
        45px 20px;

    text-align:center;

    border:
        1px dashed var(--border);

    border-radius:13px;

    color:
        var(--muted);

    font-size:10px;

}

.empty-icon{

    font-size:34px;

    margin-bottom:9px;

}

.empty strong{

    display:block;

    color:
        var(--text);

    font-size:12px;

    margin-bottom:4px;

}


/* =========================================================
   ERROR BOX
========================================================= */

.error-box{

    margin-bottom:18px;

    padding:13px 15px;

    border:
        1px solid rgba(239,68,68,.18);

    border-radius:11px;

    background:
        rgba(239,68,68,.08);

    color:
        var(--red);

    font-size:10px;

    line-height:1.6;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    padding:25px;

    border-top:
        1px solid var(--border);

    text-align:center;

    color:
        var(--muted);

    font-size:10px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1100px){

    .main-grid{

        grid-template-columns:1fr;

    }

    .stats{

        grid-template-columns:
            repeat(
                3,
                1fr
            );

    }

}


@media(max-width:900px){

    .nav-links{

        display:none;

    }

}


@media(max-width:700px){

    .stats{

        grid-template-columns:
            repeat(
                2,
                1fr
            );

    }

    .toolbar{

        flex-direction:column;

        align-items:stretch;

    }

    .filter{

        width:100%;

    }

    .listing{

        grid-template-columns:
            70px
            1fr;

    }

    .listing-photo{

        width:70px;

        height:65px;

    }

    .listing-actions{

        grid-column:
            1 / -1;

        justify-content:flex-start;

        padding-top:9px;

        border-top:
            1px solid var(--border);

    }

    .page-header{

        align-items:flex-start;

        flex-direction:column;

    }

}


@media(max-width:520px){

    .navbar{

        padding:
            0 4%;

    }

    .admin-badge{

        display:none;

    }

    .page{

        width:94%;

        padding-top:28px;

    }

    .stats{

        grid-template-columns:
            1fr
            1fr;

    }

    .listing{

        grid-template-columns:
            1fr;

    }

    .listing-photo{

        width:100%;

        height:140px;

    }

    .listing-actions{

        grid-column:auto;

    }

}

</style>

</head>

<!-- =========================================================
     THEME
========================================================= -->

<script>

(function(){

    const button =
        document.getElementById(
            "themeBtn"
        );


    function updateButton(){

        const dark =
            document.documentElement
                .classList
                .contains("dark");


        button.textContent =
            dark
                ? "☀"
                : "☾";

    }


    updateButton();


    button.addEventListener(
        "click",
        function(){

            const dark =
                document.documentElement
                    .classList
                    .contains("dark");


            document.documentElement
                .classList
                .toggle(
                    "dark"
                );


            localStorage.setItem(
                "pd_theme",
                dark
                    ? "light"
                    : "dark"
            );


            updateButton();

        }
    );

})();

</script>


<!-- =========================================================
     FIREBASE ADMIN SYSTEM
========================================================= -->

<script type="module">

import {

    auth,
    onAuthStateChanged,
    signOut

} from "./firebase.js";


import {

    collection,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================================================
   ELEMENTS
========================================================= */

const app =
    document.getElementById(
        "app"
    );


/* =========================================================
   ADMIN ACCOUNT
=========================================================

   IMPORTANT:

   This is only the FRONTEND admin gate.

   Firestore Security Rules must also contain
   the correct admin UID.

========================================================= */

const ADMIN_EMAIL =
    "thashindu07dimalsha@gmail.com";


let currentUser =
    null;


let allVehicles =
    [];


let unsubscribeVehicles =
    null;


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            window.location.replace(
                "login.html"
            );

            return;

        }


        currentUser =
            user;


        if(
            !isAdmin()
        ){

            renderAccessDenied();

            return;

        }


        startAdminVehicles();

    }
);


/* =========================================================
   ADMIN CHECK
========================================================= */

function isAdmin(){

    return (

        currentUser
        &&
        currentUser.email
        &&
        currentUser.email
            .toLowerCase()
        ===
        ADMIN_EMAIL
            .toLowerCase()

    );

}


/* =========================================================
   START FIRESTORE
========================================================= */

function startAdminVehicles(){

    const vehiclesRef =
        collection(
            db,
            "vehicles"
        );


    unsubscribeVehicles =
        onSnapshot(

            vehiclesRef,

            snapshot => {

                allVehicles =
                    snapshot.docs.map(
                        documentSnap => ({

                            id:
                                documentSnap.id,

                            ...documentSnap.data()

                        })
                    );


                renderDashboard();

            },


            error => {

                console.error(
                    "Admin Firestore error:",
                    error
                );


                renderFirestoreError(
                    error
                );

            }

        );

}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){

    const total =
        allVehicles.length;


    const pending =
        allVehicles.filter(
            vehicle =>
                vehicle.status ===
                "pending"
        ).length;


    const active =
        allVehicles.filter(
            vehicle =>
                vehicle.status ===
                "active"
        ).length;


    const sold =
        allVehicles.filter(
            vehicle =>
                vehicle.status ===
                "sold"
        ).length;


    const dealers =
        new Set(
            allVehicles
                .map(
                    vehicle =>
                        vehicle.ownerUid
                )
                .filter(Boolean)
        ).size;


    app.innerHTML = `

        <!-- HEADER -->

        <div class="page-header">

            <div>

                <div class="eyebrow">
                    PROPERTY DEALERS / ADMINISTRATION
                </div>


                <h1>
                    Admin Dashboard
                </h1>


                <p>
                    Review listings, manage marketplace
                    inventory and monitor vehicle activity.
                </p>

            </div>

        </div>


        <!-- STATS -->

        <section class="stats">


            <div class="stat-card">

                <div class="stat-label">
                    TOTAL LISTINGS
                </div>

                <div class="stat-value">
                    ${total}
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    PENDING REVIEW
                </div>

                <div class="stat-value orange">
                    ${pending}
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    AVAILABLE
                </div>

                <div class="stat-value green">
                    ${active}
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    SOLD
                </div>

                <div class="stat-value red">
                    ${sold}
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    DEALERS
                </div>

                <div class="stat-value">
                    ${dealers}
                </div>

            </div>


        </section>


        <!-- MAIN -->

        <div class="main-grid">


            <!-- LISTINGS -->

            <section class="panel">


                <div class="panel-head">

                    <div>

                        <div class="panel-title">
                            Vehicle Listings
                        </div>

                        <div class="panel-subtitle">
                            Review and manage Firestore marketplace vehicles.
                        </div>

                    </div>

                </div>


                <div class="toolbar">


                    <input
                        type="text"
                        id="searchInput"
                        class="search"
                        placeholder="Search vehicle or dealer..."
                    >


                    <select
                        id="statusFilter"
                        class="filter"
                    >

                        <option value="all">
                            All Status
                        </option>

                        <option value="pending">
                            Pending
                        </option>

                        <option value="active">
                            Available
                        </option>

                        <option value="sold">
                            Sold
                        </option>

                    </select>


                </div>


                <div
                    id="listingList"
                    class="list"
                ></div>


            </section>


            <!-- SIDEBAR -->

            <aside>


                <section class="panel">


                    <div class="panel-head">

                        <div class="panel-title">
                            Admin Tools
                        </div>

                    </div>


                    <div class="tool-list">


                        <a
                            href="search.html"
                            class="tool"
                        >

                            <div class="tool-info">

                                <strong>
                                    Marketplace
                                </strong>

                                <span>
                                    View public listings
                                </span>

                            </div>

                            <div class="tool-arrow">
                                →
                            </div>

                        </a>


                        <a
                            href="dealer.html"
                            class="tool"
                        >

                            <div class="tool-info">

                                <strong>
                                    Dealer Dashboard
                                </strong>

                                <span>
                                    View dealer area
                                </span>

                            </div>

                            <div class="tool-arrow">
                                →
                            </div>

/* =========================================================
   LISTINGS
========================================================= */

function renderListings(){

    const list =
        document.getElementById(
            "listingList"
        );


    if(!list){

        return;

    }


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const statusFilter =
        document.getElementById(
            "statusFilter"
        );


    const search =
        String(
            searchInput?.value
            ||
            ""
        )
        .trim()
        .toLowerCase();


    const selectedStatus =
        statusFilter?.value
        ||
        "all";


    const filtered =
        allVehicles.filter(
            vehicle => {

                const title =
                    String(
                        vehicle.title
                        ||
                        `${vehicle.make || ""} ${
                            vehicle.model || ""
                        }`
                    )
                    .toLowerCase();


                const seller =
                    String(
                        vehicle.seller
                        ||
                        ""
                    )
                    .toLowerCase();


                const matchesSearch =
                    !search
                    ||
                    title.includes(
                        search
                    )
                    ||
                    seller.includes(
                        search
                    );


                const matchesStatus =
                    selectedStatus ===
                        "all"
                    ||
                    (
                        String(
                            vehicle.status
                            ||
                            "pending"
                        )
                        ===
                        selectedStatus
                    );


                return (
                    matchesSearch
                    &&
                    matchesStatus
                );

            }
        );


    const sorted =
        [
            ...filtered
        ]
        .sort(
            (
                a,
                b
            ) => {

                if(
                    a.status ===
                        "pending"
                    &&
                    b.status !==
                        "pending"
                ){

                    return -1;

                }


                if(
                    a.status !==
                        "pending"
                    &&
                    b.status ===
                        "pending"
                ){

                    return 1;

                }


                return (
                    timestampValue(
                        b.createdAt
                    )
                    -
                    timestampValue(
                        a.createdAt
                    )
                );

            }
        );


    if(
        sorted.length ===
        0
    ){

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📋
                </div>

                <strong>
                    No listings found
                </strong>

                Try changing your search or status filter.

            </div>

        `;

        return;

    }


    list.innerHTML =
        sorted
            .map(
                vehicleHTML
            )
            .join("");


    bindListingActions();

}


/* =========================================================
   VEHICLE HTML
========================================================= */

function vehicleHTML(
    vehicle
){

    const status =
        String(
            vehicle.status
            ||
            "pending"
        );


    let actions =
        "";


    if(
        status ===
        "pending"
    ){

        actions = `

            <button
                type="button"
                class="btn approve"

                data-id="${escapeAttribute(
                    vehicle.id
                )}"
            >

            </button>


            <button
                type="button"
                class="btn reject"
                data-action="reject"
                data-id="${escapeAttribute(
                    vehicle.id
                )}"
            >

            </button>

        `;

    }


    else
    if(
        status ===

    ){

        actions = `

                    vehicle.id
                )}"
            >

            </button>

        `;

    }


    else
    if(
        status ===
        "sold"
    ){

        actions = `

            <button

                class="btn"
                data-action="available"
                data-id="${escapeAttribute(
                    vehicle.id
                )}"
            >
                Make Available
            </button>

        `;

    }


    return `

        <article class="listing">


            <div class="listing-photo">

                ${photoHTML(
                    vehicle
                )}

            </div>


            <div class="listing-main">


                <div class="listing-top">

                            }`
                        )}

                        class="status ${escapeAttribute(
                            status
                        )}"
                    >

                        ${statusLabel(
                            status
                        )}

                    </span>


                </div>

                    ${formatPrice(
                        vehicle.price
                    )}

                            vehicle.fuel

                        )}

                    <span>
                        📍
                        ${escapeHTML(
                            vehicle.location
                            ||

                        )}
                    </span>


                    <span>
                        👤
                        ${escapeHTML(
                            vehicle.seller
                            ||

                    href="vehicle.html?vehicle=${encodeURIComponent(
                        vehicle.id

                    type="button"
                    class="btn delete"
                    data-action="delete"

                        vehicle.id
                    )}"

        </article>

    `;

}


/* =========================================================
   PHOTO
========================================================= */

function photoHTML(
    vehicle
){

    /*
       New photo system:
       Photo 1 = photoUrls[0]

       image is only an old-data fallback.
    */

    let image =
        "";


    if(
        Array.isArray(
            vehicle.photoUrls
        )
        &&
        vehicle.photoUrls.length
    ){

        image =
            vehicle.photoUrls[0]
            ||
            "";

    }


    if(
        !image
        &&
        vehicle.image
    ){

        image =
            vehicle.image;

    }


    if(
        image
    ){

        return `

            <img
                src="${escapeAttribute(
                    image
                )}"
                alt="${escapeAttribute(
                    vehicle.title
                    ||
                    "Vehicle"
                )}"
                loading="lazy"
                onerror="
                    this.style.display='none';
                    this.nextElementSibling.style.display='block';
                "
            >


            <span
                style="
                    display:none;
                "
            >
                🚗
            </span>

        `;

    }


    return "🚗";

}


/* =========================================================
   ACTION EVENTS
========================================================= */

function bindListingActions(){

    document
        .querySelectorAll(
            "[data-action]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    async function(){

                        const action =
                            button.dataset.action;


                        const id =
                            button.dataset.id;


                        if(
                            action ===
                            "approve"
                        ){

                            await updateVehicleStatus(
                                id,
                                "active",
                                "Vehicle approved successfully."
                            );

                        }


                        else
                        if(
                            action ===
                            "reject"
                        ){

                            await rejectVehicle(
                                id
                            );

                        }


                        else
                        if(
                            action ===
                            "sold"
                        ){

                            await updateVehicleStatus(
                                id,
                                "sold",
                                "Vehicle marked as sold."
                            );

                        }


                        else
                        if(
                            action ===
                            "available"
                        ){

                            await updateVehicleStatus(
                                id,
                                "active",
                                "Vehicle is available again."
                            );

                        }


                        else
                        if(
                            action ===
                            "delete"
                        ){

                            await deleteVehicle(
                                id
                            );

                        }

                    }
                );

            }
        );

}


/* =========================================================
   UPDATE STATUS
========================================================= */

async function updateVehicleStatus(
    id,
    status,
    successMessage
){

    const vehicle =
        allVehicles.find(
            item =>
                String(
                    item.id
                )
                ===
                String(id)
        );


    if(!vehicle){

        alert(
            "Vehicle not found."
        );

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "vehicles",
                id
            ),
            {

                status:
                    status,

                updatedAt:
                    serverTimestamp()

            }
        );


        /*
           onSnapshot will update the UI automatically.
        */

    }
    catch(error){

        console.error(
            "Status update error:",
            error
        );


        alert(
            "Permission denied or Firestore error.\n\n"
            +
            (
                error.message
                ||
                "Could not update vehicle."
            )
        );

    }

}


/* =========================================================
   REJECT
========================================================= */

async function rejectVehicle(
    id
){

    const confirmed =
        confirm(
            "Reject this vehicle listing?"
        );


    if(
        !confirmed
    ){

        return;

    }


    /*
       Rejection means the listing is removed
       from the marketplace.

       We delete the Firestore vehicle document.
    */

    await deleteVehicle(
        id,
        false
    );

}


/* =========================================================
   DELETE
========================================================= */

async function deleteVehicle(
    id,
    ask = true
){

    if(
        ask
    ){

        const confirmed =
            confirm(
                "Delete this listing permanently?"
            );


        if(
            !confirmed
        ){

            return;

        }

    }


    try{

        await deleteDoc(
            doc(
                db,
                "vehicles",
                id
            )
        );


    }
    catch(error){

        console.error(
            "Delete error:",
            error
        );


        alert(
            "Permission denied or Firestore error.\n\n"
            +
            (
                error.message
                ||
                "Could not delete vehicle."
            )
        );

    }

}

/* =========================================================

========================================================= */

    value
){

        Number(
            value
            ||

        )
        .toLocaleString(
            "en-LK"
        )
    );

/* =========================================================
   FORMAT MILEAGE
========================================================= */

function formatMileage(
    value
){

    return (
        Number(
            value
            ||
            0
        )
        .toLocaleString(
            "en-LK"
        )
        +
        " km"
    );

}


/* =========================================================
   TIMESTAMP
========================================================= */

function timestampValue(
    value
){

    if(
        !value
    ){

        return 0;

    }


    if(
        typeof value.toMillis
        ===
        "function"
    ){

        return value.toMillis();

    }


    if(
        typeof value.seconds
        ===
        "number"
    ){

        return (
            value.seconds
            *
            1000
        );

    }


    if(
        typeof value
        ===
        "number"
    ){

        return value;

    }


    return 0;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(
        value
        ??
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return escapeHTML(
        value
    );

}
