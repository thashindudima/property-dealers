<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dealer Dashboard | PROPERTY DEALERS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<script>
(function(){

    const theme =
        localStorage.getItem("pd_theme")
        || "dark";

    if(theme === "dark"){

        document.documentElement
            .classList
            .add("dark");

    }

})();
</script>


<style>

/* =========================================================
   THEME
========================================================= */

:root{

    --bg:#f5f3fb;
    --surface:#ffffff;
    --surface2:#faf9fd;

    --text:#17131f;
    --muted:#756e82;

    --border:#e7e1ef;

    --purple:#7c3aed;
    --purple2:#9f67ff;

    --purple-light:
        rgba(124,58,237,.10);

    --green:#16a34a;
    --red:#ef4444;
    --orange:#f59e0b;
    --blue:#2563eb;

    --shadow:
        0 18px 50px
        rgba(67,45,105,.09);

}


html.dark{

    --bg:#09080e;
    --surface:#12101a;
    --surface2:#17141f;

    --text:#f8f5ff;
    --muted:#aaa2b8;

    --border:#2b2635;

    --purple:#9b63ff;
    --purple2:#b98aff;

    --purple-light:
        rgba(155,99,255,.13);

    --green:#22c55e;
    --red:#ff5c68;
    --orange:#fbbf24;
    --blue:#60a5fa;

    --shadow:
        0 25px 65px
        rgba(0,0,0,.50);

}


/* =========================================================
   RESET
========================================================= */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

}

html{

    scroll-behavior:smooth;

}

body{

    min-height:100vh;

    font-family:
        Inter,
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at 10% 0%,
            rgba(124,58,237,.10),
            transparent 28%
        ),

        radial-gradient(
            circle at 95% 20%,
            rgba(0,200,255,.06),
            transparent 23%
        ),

        var(--bg);

    color:var(--text);

    transition:
        background .25s ease,
        color .25s ease;

}

a{

    color:inherit;
    text-decoration:none;

}

button,
input{

    font-family:inherit;

}


/* =========================================================
   NAVBAR
========================================================= */

.navbar{

    width:100%;

    height:74px;

    padding:
        0 5%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:var(--surface);

    border-bottom:
        1px solid var(--border);

    position:sticky;

    top:0;

    z-index:1000;

}

.logo{

    color:var(--text);

    font-size:21px;

    font-weight:800;

    letter-spacing:-.5px;

}

.logo span{

    color:var(--purple);

}

.nav-links{

    display:flex;

    align-items:center;

    gap:7px;

}

.nav-links a{

    min-width:82px;

    height:40px;

    padding:
        0 14px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:10px;

    color:var(--muted);

    font-size:13px;

    font-weight:600;

}

.nav-links a:hover,
.nav-links a.active{

    background:
        var(--purple-light);

    color:var(--purple);

}

.nav-actions{

    display:flex;

    align-items:center;

    gap:10px;

}

.theme-btn{

    width:42px;

    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:0;

    border:
        1px solid var(--border);

    border-radius:11px;

    background:var(--surface2);

    color:var(--text);

    font-size:18px;

    cursor:pointer;

}

.market-btn{

    height:42px;

    padding:
        0 15px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:var(--purple);

    color:#fff;

    font-size:12px;

    font-weight:700;

}


/* =========================================================
   PAGE
========================================================= */

.page{

    width:min(
        1400px,
        92%
    );

    margin:auto;

    padding:
        40px 0 80px;

}

.top-header{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:20px;

    margin-bottom:28px;

}

.eyebrow{

    color:var(--purple);

    font-size:10px;

    font-weight:800;

    letter-spacing:2px;

    margin-bottom:9px;

}

.top-header h1{

    font-size:
        clamp(
            31px,
            4vw,
            46px
        );

    line-height:1;

    letter-spacing:-1.7px;

    margin-bottom:10px;

}

.top-header p{

    color:var(--muted);

    font-size:13px;

}


/* =========================================================
   PROFILE
========================================================= */

.profile{

    min-width:245px;

    padding:
        10px 13px;

    display:flex;

    align-items:center;

    gap:11px;

    background:var(--surface);

    border:
        1px solid var(--border);

    border-radius:14px;

    box-shadow:var(--shadow);

}

.profile-photo{

    width:44px;
    height:44px;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:50%;

    background:var(--purple-light);

    color:var(--purple);

    font-size:15px;
    font-weight:800;

}

.profile-photo img{

    width:100%;
    height:100%;

    object-fit:cover;

}

.profile-info{

    min-width:0;

}

.profile-name{

    font-size:12px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.profile-email{

    margin-top:3px;

    color:var(--muted);

    font-size:9px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


/* =========================================================
   STATS
========================================================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap:15px;

    margin-bottom:25px;

}

.stat-card{

    position:relative;

    overflow:hidden;

    padding:19px;

    background:var(--surface);

    border:
        1px solid var(--border);

    border-radius:17px;

    box-shadow:var(--shadow);

}

.stat-card::after{

    content:"";

    position:absolute;

    width:90px;
    height:90px;

    right:-35px;
    top:-35px;

    border-radius:50%;

    background:var(--purple-light);

}

.stat-label{

    position:relative;

    z-index:1;

    color:var(--muted);

    font-size:9px;

    font-weight:700;

    letter-spacing:.5px;

    margin-bottom:9px;

}

.stat-number{

    position:relative;

    z-index:1;

    font-size:27px;

    font-weight:800;

    letter-spacing:-1px;

}

.stat-number.green{
    color:var(--green);
}

.stat-number.orange{
    color:var(--orange);
}

.stat-number.red{
    color:var(--red);
}


/* =========================================================
   DASHBOARD GRID
========================================================= */

.dashboard-grid{

    display:grid;

    grid-template-columns:
        1.15fr
        .85fr;

    gap:20px;

    align-items:start;

}


/* =========================================================
   PANEL
========================================================= */

.panel{

    background:var(--surface);

    border:
        1px solid var(--border);

    border-radius:20px;

    padding:20px;

    box-shadow:var(--shadow);

}

.panel-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:17px;

}

.panel-title{

    font-size:17px;

    font-weight:800;

    letter-spacing:-.4px;

}

.panel-link{

    color:var(--purple);

    font-size:10px;

    font-weight:700;

}

.panel-link:hover{

    text-decoration:underline;

}


/* =========================================================
   QUICK ACTIONS
========================================================= */

.quick-grid{

    display:grid;

    grid-template-columns:
        repeat(
            2,
            1fr
        );

    gap:10px;

}

.quick-card{

    padding:16px;

    border:
        1px solid var(--border);

    border-radius:13px;

    background:var(--surface2);

    transition:.2s;

}

.quick-card:hover{

    transform:
        translateY(-2px);

    border-color:var(--purple);

}

.quick-icon{

    width:38px;
    height:38px;

    margin-bottom:11px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:var(--purple-light);

    color:var(--purple);

    font-size:18px;

    font-weight:800;

}

.quick-title{

    font-size:12px;

    font-weight:800;

    margin-bottom:4px;

}

.quick-text{

    color:var(--muted);

    font-size:9px;

    line-height:1.5;

}


/* =========================================================
   LISTINGS
========================================================= */

.listing-list{

    display:grid;

    gap:10px;

}

.listing{

    display:grid;

    grid-template-columns:
        65px
        1fr
        auto;

    gap:12px;

    align-items:center;

    padding:10px;

    border:
        1px solid var(--border);

    border-radius:12px;

    background:var(--surface2);

}

.listing-photo{

    width:65px;
    height:56px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:9px;

    background:var(--surface);

    font-size:27px;

}

.listing-photo img{

    width:100%;
    height:100%;

    object-fit:cover;

}

.listing-main{

    min-width:0;

}

.listing-title{

    font-size:12px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-bottom:5px;

}

.listing-price{

    color:var(--purple);

    font-size:12px;

    font-weight:800;

    margin-bottom:5px;

}

.listing-meta{

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    color:var(--muted);

    font-size:9px;

}

.listing-status{

    padding:
        5px 8px;

    border-radius:50px;

    font-size:8px;

    font-weight:800;

    letter-spacing:.5px;

    white-space:nowrap;

}

.listing-status.active{

    color:var(--green);

    background:
        rgba(22,163,74,.12);

}

.listing-status.pending{

    color:var(--orange);

    background:
        rgba(245,158,11,.12);

}

.listing-status.sold{

    color:var(--red);

    background:
        rgba(239,68,68,.12);

}


/* =========================================================
   PROFILE SETTINGS
========================================================= */

.profile-settings{

    display:grid;

    gap:13px;

}

.field{

    display:flex;

    flex-direction:column;

    gap:7px;

}

.field label{

    color:var(--muted);

    font-size:9px;

    font-weight:800;

    letter-spacing:.5px;

}

.input{

    width:100%;

    height:43px;

    padding:
        0 11px;

    border:
        1px solid var(--border);

    border-radius:10px;

    outline:none;

    background:var(--surface2);

    color:var(--text);

    font-size:10px;

}

.input:focus{

    border-color:var(--purple);

    box-shadow:
        0 0 0 3px
        rgba(124,58,237,.08);

}

.input.readonly{

    opacity:.6;

    cursor:not-allowed;

}


/* =========================================================
   CONTACT OPTIONS
========================================================= */

.contact-options{

    display:grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap:8px;

}

.contact-option{

    position:relative;

}

.contact-option input{

    position:absolute;

    opacity:0;

    pointer-events:none;

}

.contact-label{

    min-height:63px;

    padding:9px;

    display:flex;

    align-items:center;

    gap:8px;

    border:
        1px solid var(--border);

    border-radius:10px;

    background:var(--surface2);

    cursor:pointer;

    transition:.2s;

}

.contact-label:hover{

    border-color:var(--purple);

}

.contact-option input:checked
+
.contact-label{

    border-color:var(--purple);

    background:var(--purple-light);

}

.contact-icon{

    width:31px;
    height:31px;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:var(--surface);

    font-size:14px;

}

.contact-label strong{

    display:block;

    font-size:9px;

    margin-bottom:2px;

}

.contact-label span{

    display:block;

    color:var(--muted);

    font-size:7px;

}


/* =========================================================
   PROFILE ACTIONS
========================================================= */

.save-profile{

    width:100%;

    height:43px;

    margin-top:2px;

    border:
        1px solid var(--purple);

    border-radius:10px;

    background:var(--purple);

    color:#fff;

    font-size:10px;

    font-weight:800;

    cursor:pointer;

}

.save-profile:disabled{

    opacity:.6;

    cursor:wait;

}

.signout-btn{

    width:100%;

    height:40px;

    margin-top:8px;

    border:
        1px solid var(--border);

    border-radius:10px;

    background:var(--surface2);

    color:var(--red);

    font-size:10px;

    font-weight:800;

    cursor:pointer;

}

.signout-btn:hover{

    border-color:var(--red);

}


/* =========================================================
   PROFILE MESSAGE
========================================================= */

.profile-message{

    display:none;

    padding:
        10px 11px;

    border-radius:9px;

    font-size:9px;

    line-height:1.6;

}

.profile-message.show{

    display:block;

}

.profile-message.success{

    color:var(--green);

    background:
        rgba(22,163,74,.08);

    border:
        1px solid
        rgba(22,163,74,.16);

}

.profile-message.error{

    color:var(--red);

    background:
        rgba(239,68,68,.08);

    border:
        1px solid
        rgba(239,68,68,.16);

}


/* =========================================================
   MARKET CTA
========================================================= */

.market-cta{

    margin-top:20px;

    padding:20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    border:
        1px solid var(--border);

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            var(--purple-light),
            transparent
        );

}

.market-cta h3{

    font-size:16px;

    margin-bottom:6px;

}

.market-cta p{

    color:var(--muted);

    font-size:10px;

}

.cta-btn{

    min-width:120px;

    height:42px;

    padding:
        0 15px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:var(--purple);

    color:#fff;

    font-size:11px;

    font-weight:800;

}


/* =========================================================
   EMPTY
========================================================= */

.empty-state{

    padding:
        35px 15px;

    text-align:center;

    border:
        1px dashed var(--border);

    border-radius:13px;

    color:var(--muted);

    font-size:10px;

}

.empty-state-icon{

    font-size:30px;

    margin-bottom:8px;

}

.empty-state strong{

    display:block;

    color:var(--text);

    margin-bottom:4px;

    font-size:12px;

}


/* =========================================================
   PAGE LOADING
========================================================= */

.page-loading{

    min-height:60vh;

    display:flex;

    align-items:center;

    justify-content:center;

    color:var(--muted);

    font-size:12px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1080px){

    .dashboard-grid{

        grid-template-columns:1fr;

    }

    .stats{

        grid-template-columns:
            repeat(
                2,
                1fr
            );

    }

}

@media(max-width:900px){

    .nav-links{

        display:none;

    }

}

@media(max-width:650px){

    .navbar{

        padding:
            0 4%;

    }

    .market-btn{

        display:none;

    }

    .page{

        width:94%;

        padding-top:28px;

    }

    .top-header{

        align-items:stretch;

        flex-direction:column;

    }

    .profile{

        width:100%;

        min-width:0;

    }

    .stats{

        grid-template-columns:
            repeat(
                2,
                1fr
            );

    }

    .stat-card{

        padding:15px;

    }

    .stat-number{

        font-size:23px;

    }

    .quick-grid{

        grid-template-columns:1fr;

    }

    .contact-options{

        grid-template-columns:1fr;

    }

    .listing{

        grid-template-columns:
            55px
            1fr;

    }

    .listing-photo{

        width:55px;

        height:50px;

    }

    .listing-status{

        grid-column:2;

        justify-self:start;

    }

    .market-cta{

        align-items:flex-start;

        flex-direction:column;

    }

    .cta-btn{

        width:100%;

    }

    .logo{

        font-size:18px;

    }

}

</style>

</head>

<!-- =========================================================
     THEME
========================================================= -->

<script>

const themeBtn =
    document.getElementById(
        "themeBtn"
    );


function updateThemeButton(){

    const dark =
        document.documentElement
            .classList
            .contains("dark");


    themeBtn.textContent =
        dark
            ? "☀"
            : "☾";

}


updateThemeButton();


themeBtn.addEventListener(
    "click",
    function(){

        const dark =
            document.documentElement
                .classList
                .contains("dark");


        document.documentElement
            .classList
            .toggle("dark");


        localStorage.setItem(
            "pd_theme",
            dark
                ? "light"
                : "dark"
        );


        updateThemeButton();

    }
);

</script>


<!-- =========================================================
     FIREBASE
========================================================= -->

<script type="module">

import {

    auth,
    db,
    onAuthStateChanged,
    signOut

} from "./firebase.js";


import {

    collection,
    query,
    where,
    onSnapshot,
    doc,
    getDoc,
    getDocs,
    setDoc,
    updateDoc,
    serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================================================
   ELEMENT
========================================================= */

const dashboard =
    document.getElementById(
        "dashboard"
    );


/* =========================================================
   STATE
========================================================= */

let currentUser =
    null;

let myVehicles =
    [];

let profile =
    null;

let unsubscribeVehicles =
    null;


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.replace(
                "login.html"
            );

            return;

        }


        currentUser =
            user;


        try{

            await loadProfile();

            startVehicleListener();

        }
        catch(error){

            console.error(
                "Dealer initialization error:",
                error
            );


            profile = {

                uid:
                    currentUser.uid,

                email:
                    currentUser.email
                    ||
                    "",

                displayName:
                    currentUser.displayName
                    ||
                    "Dealer",

                phoneNumber:
                    "",

                contactMethods: {

                    whatsapp:false,

                    phone:false,

                    email:false

                },

                photoURL:
                    currentUser.photoURL
                    ||
                    ""

            };


            startVehicleListener();

        }

    }
);


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

    const userRef =
        doc(
            db,
            "users",
            currentUser.uid
        );


    const snapshot =
        await getDoc(
            userRef
        );


    if(
        snapshot.exists()
    ){

        profile =
            snapshot.data();

    }
    else{

        profile = {

            uid:
                currentUser.uid,

            email:
                currentUser.email
                ||
                "",

            displayName:
                currentUser.displayName
                ||
                "Dealer",

            photoURL:
                currentUser.photoURL
                ||
                "",

            phoneNumber:
                "",

            contactMethods: {

                whatsapp:false,

                phone:false,

                email:false

            }

        };


        await setDoc(
            userRef,
            {

                ...profile,

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );

    }


    /*
       Always keep the latest Google
       account information.
    */

    profile = {

        ...profile,

        uid:
            currentUser.uid,

        email:
            currentUser.email
            ||
            profile.email
            ||
            "",

        photoURL:
            currentUser.photoURL
            ||
            profile.photoURL
            ||
            ""

    };

/* =========================================================
   VEHICLE LISTENER
========================================================= */

function startVehicleListener(){

    if(unsubscribeVehicles){

        unsubscribeVehicles();

    }


    const vehiclesRef =
        collection(
            db,
            "vehicles"
        );


    const vehicleQuery =
        query(
            vehiclesRef,
            where(
                "ownerUid",
                "==",
                currentUser.uid
            )
        );


    unsubscribeVehicles =
        onSnapshot(
            vehicleQuery,

            snapshot => {

                myVehicles =
                    snapshot.docs
                        .map(
                            item => ({

                                id:
                                    item.id,

                                ...item.data()

                            })
                        );


                myVehicles.sort(
                    (a,b) =>
                        timestampValue(
                            b.createdAt
                        )
                        -
                        timestampValue(
                            a.createdAt
                        )
                );


                renderDashboard();

            },

            error => {

                console.error(
                    "Vehicle listener error:",
                    error
                );


                myVehicles =
                    [];


                renderDashboard(
                    error
                );

            }

        );

}

/* =========================================================
   RENDER LISTINGS
========================================================= */

function renderListings(
    vehicles
){

    return `

        <div class="listing-list">

            ${
                vehicles
                    .map(
                        vehicle => {

                            const title =
                                vehicle.title
                                ||
                                `${vehicle.make || ""} ${
                                    vehicle.model || ""
                                }`
                                .trim()
                                ||
                                "Vehicle";


                            /*
                               IMPORTANT:
                               Photo 1 is always
                               photoUrls[0].
                            */

                            let image =
                                "";


                            if(
                                Array.isArray(
                                    vehicle.photoUrls
                                )
                                &&
                                vehicle.photoUrls.length
                            ){

                                image =
                                    vehicle.photoUrls[0]
                                    ||
                                    "";

                            }


                            /*
                               Old documents fallback.
                            */

                            if(
                                !image
                                &&
                                vehicle.image
                            ){

                                image =
                                    vehicle.image;

                            }


                            const status =
                                String(
                                    vehicle.status
                                    ||
                                    "pending"
                                )
                                .toLowerCase();


                            return `

                                <div class="listing">


                                    <div class="listing-photo">


                                        ${
                                            image
                                            ?
                                            `
                                                <img
                                                    src="${escapeAttribute(
                                                        image
                                                    )}"
                                                    alt="${escapeAttribute(
                                                        title
                                                    )}"
                                                    onerror="
                                                        this.style.display='none';
                                                        this.nextElementSibling.style.display='block';
                                                    "
                                                >

                                                <span
                                                    style="display:none"
                                                >
                                                    🚗
                                                </span>
                                            `
                                            :
                                            "🚗"
                                        }


                                    </div>


                                    <div class="listing-main">


                                        <div class="listing-title">

                                            ${escapeHTML(
                                                title
                                            )}

                                        </div>


                                        <div class="listing-price">

                                            ${formatPrice(
                                                vehicle.price
                                            )}

                                        </div>


                                        <div class="listing-meta">

                                            <span>
                                                ${vehicle.year || "—"}
                                            </span>

                                            <span>
                                                ${formatMileage(
                                                    vehicle.mileage
                                                )}
                                            </span>

                                            <span>
                                                ${escapeHTML(
                                                    vehicle.location
                                                    ||
                                                    "Sri Lanka"
                                                )}
                                            </span>

                                        </div>


                                    </div>


                                    <div
                                        class="listing-status ${escapeAttribute(
                                            status
                                        )}"
                                    >

                                        ${escapeHTML(
                                            status.toUpperCase()
                                        )}

                                    </div>


                                </div>

                            `;

                        }
                    )
                    .join("")
            }

        </div>

    `;

}

/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile(){

    const saveBtn =
        document.getElementById(
            "saveProfileBtn"
        );


    const messageBox =
        document.getElementById(
            "profileMessage"
        );


    if(
        !saveBtn
        ||
        !messageBox
    ){

        return;

    }


    const displayName =
        document.getElementById(
            "profileDisplayName"
        )
        .value
        .trim();


    const phoneNumber =
        document.getElementById(
            "profilePhone"
        )
        .value
        .trim();


    const contactMethods = {

        whatsapp:
            document.getElementById(
                "profileWhatsApp"
            ).checked,

        phone:
            document.getElementById(
                "profilePhoneContact"
            ).checked,

        email:
            document.getElementById(
                "profileEmailContact"
            ).checked

    };


    /* =========================================
       VALIDATION
    ========================================== */

    if(!displayName){

        showProfileMessage(
            "Please enter your display name.",
            "error"
        );

        return;

    }


    if(
        (
            contactMethods.whatsapp
            ||
            contactMethods.phone
        )
        &&
        !phoneNumber
    ){

        showProfileMessage(
            "Please enter a phone number because WhatsApp or Phone contact is enabled.",
            "error"
        );

        return;

    }


    try{

        saveBtn.disabled =
            true;

        saveBtn.textContent =
            "Saving...";


        /* =========================================
           1. USER PROFILE
        ========================================== */

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        await setDoc(
            userRef,
            {

                uid:
                    currentUser.uid,

                email:
                    currentUser.email
                    ||
                    "",

                displayName,

                phoneNumber,

                contactMethods,

                photoURL:
                    currentUser.photoURL
                    ||
                    profile?.photoURL
                    ||
                    "",

                updatedAt:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );


        /* =========================================
           2. FIREBASE AUTH DISPLAY NAME
        ========================================== */

        try{

            const {
                updateProfile
            } =
                await import(
                    "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js"
                );


            await updateProfile(
                currentUser,
                {
                    displayName
                }
            );

        }
        catch(authError){

            console.warn(
                "Auth profile update failed:",
                authError
            );

        }


        /* =========================================
           3. UPDATE ALL MY VEHICLES
        ========================================== */

        const vehiclesRef =
            collection(
                db,
                "vehicles"
            );


        const vehicleQuery =
            query(
                vehiclesRef,
                where(
                    "ownerUid",
                    "==",
                    currentUser.uid
                )
            );


        const snapshot =
            await getDocs(
                vehicleQuery
            );


        const updatePromises =
            snapshot.docs.map(
                vehicleDoc => {

                    const vehicleRef =
                        doc(
                            db,
                            "vehicles",
                            vehicleDoc.id
                        );


                    return updateDoc(
                        vehicleRef,
                        {

                            seller:
                                displayName,

                            sellerPhone:
                                phoneNumber,

                            ownerEmail:
                                currentUser.email
                                ||
                                "",

                            contactMethods,

                            updatedAt:
                                serverTimestamp()

                        }
                    );

                }
            );


        await Promise.all(
            updatePromises
        );


        /* =========================================
           4. LOCAL PROFILE
        ========================================== */

        profile = {

            ...profile,

            uid:
                currentUser.uid,

            email:
                currentUser.email
                ||
                "",

            displayName,

            phoneNumber,

            contactMethods,

            photoURL:
                currentUser.photoURL
                ||
                profile?.photoURL
                ||
                ""

        };


        /* =========================================
           5. SUCCESS
        ========================================== */

        showProfileMessage(
            snapshot.size > 0
                ?
                `Profile saved. ${snapshot.size} vehicle listing${
                    snapshot.size === 1 ? "" : "s"
                } updated.`
                :
                "Profile saved successfully.",
            "success"
        );


        saveBtn.disabled =
            false;

        saveBtn.textContent =
            "Saved ✓";


        /*
           Redraw dashboard after a
           short delay so the inputs
           remain visible while the
           success message is shown.
        */

        setTimeout(
            function(){

                if(
                    currentUser
                    &&
                    dashboard
                ){

                    renderDashboard();

                }

            },
            900
        );

    }
    catch(error){

        console.error(
            "Save profile error:",
            error
        );


        showProfileMessage(
            error.message
            ||
            "Could not save profile.",
            "error"
        );


        saveBtn.disabled =
            false;

        saveBtn.textContent =
            "Save Profile";

    }

}


/* =========================================================
   PROFILE MESSAGE
========================================================= */

function showProfileMessage(

){

}


/* =========================================================
   LOGOUT
========================================================= */

async function logoutUser(){

    try{

        if(unsubscribeVehicles){

            unsubscribeVehicles();

        }


        await signOut(
            auth
        );


        window.location.replace(
            "login.html"
        );

/* =========================================================
   SORT
========================================================= */

function sortRecent(
    vehicles
){

    return [
        ...vehicles
    ]
    .sort(
        (a,b) =>
            timestampValue(
                b.createdAt
            )
            -
            timestampValue(
                a.createdAt
            )
    );

}


/* =========================================================
   TIMESTAMP
========================================================= */

function timestampValue(
    value
){

    if(!value){

        return 0;

    }


    if(
        typeof value.toMillis
        ===
        "function"
    ){

        return value.toMillis();

    }


    if(
        typeof value.seconds
        ===
        "number"
    ){

        return (
            value.seconds
            *
            1000
        );

    }


    if(
        typeof value
        ===
        "number"
    ){

        return value;

    }


    return 0;

}


/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(
    value
){

    return (
        "Rs. "
        +
        Number(
            value
            ||
            0
        )
        .toLocaleString(
            "en-LK"
        )
    );

}


/* =========================================================
   FORMAT MILEAGE
========================================================= */

function formatMileage(
    value
){

    return (
        Number(
            value
            ||
            0
        )
        .toLocaleString(
            "en-LK"
        )
        +
        " km"
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(
        value
        ??
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttribute(
    value
){

    return escapeHTML(
        value
    );

}

</script>
